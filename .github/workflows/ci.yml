# The gate the agent cannot switch off locally (decision record 28 §4). Required checks of `protect-main`.
# Third-party actions are pinned by commit SHA; versions older than 7 days (decision record 15).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      BASE: origin/${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: Per-commit rules — instructions separate, no DEBUG:, TODO with register ID, Refs
        run: python3 scripts/git_checks.py ci "$BASE" "$HEAD_BRANCH"
      - name: Commit messages (Conventional Commits)
        run: commitlint --from "$BASE" --to HEAD
      - name: Secrets in the pull request's commits
        run: gitleaks git --log-opts="$BASE..HEAD" --redact --no-banner .

  clean-clone:
    name: clean-clone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Infection compares changed lines with the base branch
      - name: Reviewer's start — docker compose up -d (QAS-DEPLOY-clean-clone-start)
        run: docker compose up -d --build
      - name: The API answers
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/api/doc.json && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Security baseline (docs/architecture/asvs-l1.md — V3.2.1, V13.4.1)
        run: |
          curl -fsS -D - -o /dev/null http://localhost:8080/api/doc.json | grep -qi '^x-content-type-options: nosniff'
          curl -sS -D - -o /dev/null http://localhost:8080/no-such-page | grep -qi '^x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.git/HEAD)" = 404
          docker compose exec -T app sh -c '! test -e /app/.git'
      - name: Initial statuses (QAS-DEPLOY-clean-clone-start, REQ-STATUS-initial.fresh-database)
        run: |
          names=$(curl -fsS http://localhost:8080/api/statuses | jq -r '[.items[].name] | join(",")')
          test "$names" = "new,in_progress,done" || { echo "got: $names"; exit 1; }
      # Tests run with dev dependencies; this request runs the prod image's request parsing (change
      # status-catalog: a dependency missing from prod made it answer 500).
      - name: Create a status on the prod image (REQ-STATUS-create.created)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/statuses \
            -H 'Content-Type: application/json' -d '{"name": "ci_check", "title": "CI"}')
          test "$code" = 201 || { echo "got: $code"; docker compose logs app; exit 1; }
      - name: Create a task on the prod image (REQ-TASK-create.created)
        run: |
          code=$(curl -s -o task.json -w '%{http_code}' -X POST http://localhost:8080/api/tasks \
            -H 'Content-Type: application/json' -d '{"title": "CI"}')
          test "$code" = 201 && test "$(jq -r .status task.json)" = new \
            || { echo "got: $code $(cat task.json)"; docker compose logs app; exit 1; }
      - name: Second start on the same volume (REQ-STATUS-initial.restart)
        run: |
          docker compose down
          docker compose up -d
          curl -fsS -o /dev/null --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8080/api/doc.json
          names=$(curl -fsS http://localhost:8080/api/statuses | jq -r '[.items[].name] | join(",")')
          test "$names" = "new,in_progress,done,ci_check" || { echo "got: $names"; exit 1; }
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: make setup
        run: make setup
      - name: Git hooks are installed and reject a bad commit
        run: |
          printf '<?php\n// DEBUG: must be rejected\n' > src/Bad.php
          git add src/Bad.php
          if git -c user.name=ci -c user.email=ci@example.com commit -q -m "chore: must be rejected"; then
            echo "pre-commit did not block a DEBUG: marker"
            exit 1
          fi
          git reset -q --hard
      - name: Full checks (make check)
        run: make check
      - name: Taint analysis (Psalm)
        run: make taint
      # Report only: escaped mutants show as annotations; no --min-msi until IMP-008 sets a threshold.
      - name: Mutation testing of changed lines (Infection)
        if: github.event_name == 'pull_request'
        run: make mutation BASE=origin/${{ github.base_ref }} INFECTION_ARGS=--logger-github=true
      # Local links are in make check; external ones only here (owner, 2026-10-07). docs/pre-init is the
      # frozen decision history; 403/429 are bot blocks, not dead links (change finish-init, task 5.3).
      - name: External links (lychee)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mise exec -- lychee --no-progress --max-retries 2
          --exclude-path vendor --exclude-path node_modules --exclude-path var --exclude-path docs/pre-init
          --exclude localhost --accept '200..=299,403,429' './**/*.md'
