openapi: 3.0.0
info:
  title: 'Task Manager API'
  version: 1.0.0
paths:
  /api/statuses:
    get:
      tags:
        - Statuses
      operationId: get_status_list
      responses:
        '200':
          description: 'Every status in creation order'
          content:
            application/json:
              schema:
                required:
                  - items
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StatusView' } }
                type: object
    post:
      tags:
        - Statuses
      operationId: post_status_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStatusRequest'
      responses:
        '201':
          description: 'The created status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusView'
        '400':
          description: 'Malformed JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'A status with this name exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: 'The body is not JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'The body breaks a rule; violations per field'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/api/statuses/{id}':
    get:
      tags:
        - Statuses
      operationId: get_status_get
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusView'
        '404':
          description: 'No status has this id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/tasks:
    get:
      tags:
        - Tasks
      operationId: get_task_list
      parameters:
        -
          name: status
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*$'
            nullable: true
            default: null
            maxLength: 50
      responses:
        '200':
          description: 'Tasks in creation order, optionally of one status'
          content:
            application/json:
              schema:
                required:
                  - items
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }
                type: object
        '422':
          description: 'The status filter is malformed or names no status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
        - Tasks
      operationId: post_task_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 'The created task'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 'Malformed JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: 'The body is not JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'The body breaks a rule; violations per field'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  '/api/tasks/{id}':
    get:
      tags:
        - Tasks
      operationId: get_task_get
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The task'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: 'No task has this id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        violations:
          type: array
          items:
            required:
              - propertyPath
              - title
            properties:
              propertyPath:
                type: string
              title:
                type: string
            type: object
      type: object
    Task:
      required:
        - id
        - title
        - description
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          description: 'Status name, for example "new"'
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    CreateStatusRequest:
      required:
        - name
        - title
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          maxLength: 50
        title:
          type: string
          maxLength: 255
      type: object
    CreateTaskRequest:
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          default: null
          maxLength: 5000
      type: object
    ListTasksQuery:
      properties:
        status:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          nullable: true
          default: null
          maxLength: 50
      type: object
    StatusView:
      required:
        - id
        - name
        - title
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
      type: object
tags:
  -
    name: Statuses
  -
    name: Tasks

