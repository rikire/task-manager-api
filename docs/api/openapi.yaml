openapi: 3.0.0
info:
  title: 'Task Manager API'
  version: 1.0.0
paths: {}
components:
  schemas:
    Problem:
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        violations:
          type: array
          items:
            required:
              - propertyPath
              - title
            properties:
              propertyPath:
                type: string
              title:
                type: string
            type: object
      type: object

