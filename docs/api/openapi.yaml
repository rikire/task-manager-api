openapi: 3.0.0
info:
  title: 'Task Manager API'
  version: 1.0.0
paths:
  '/api/statuses/{id}':
    get:
      tags:
        - Statuses
      operationId: get_status_get
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      responses:
        '200':
          description: 'The status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusView'
        '404':
          description: 'No status has this id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/statuses:
    get:
      tags:
        - Statuses
      operationId: get_status_list
      responses:
        '200':
          description: 'Every status in creation order'
          content:
            application/json:
              schema:
                required:
                  - items
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StatusView' } }
                type: object
components:
  schemas:
    Problem:
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        violations:
          type: array
          items:
            required:
              - propertyPath
              - title
            properties:
              propertyPath:
                type: string
              title:
                type: string
            type: object
      type: object
    StatusView:
      required:
        - id
        - name
        - title
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
      type: object
tags:
  -
    name: Statuses

