# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Domain exceptions → HTTP codes; the domain stays free of Symfony (ADR-0005, ADR-0006).
    exceptions:
        App\Status\Domain\StatusNotFound:
            status_code: 404
        App\Status\Domain\StatusNameTaken:
            status_code: 409
        App\Task\Domain\TaskNotFound:
            status_code: 404

when@test:
    framework:
        test: true
        # Lets a test count the SQL queries of one request (list endpoints must not grow with rows).
        profiler: { collect: false }
        # Stands for a mapped domain exception, to test the error `detail` (ADR-0005).
        exceptions:
            App\Tests\Fixtures\DomainRuleBroken:
                status_code: 409
        session:
            storage_factory_id: session.storage.factory.mock_file
