# Dependency rules of ADR-0006 (QAS-MAINT-layering): modules Task and Status, each with a hexagonal core
# (Domain, Application) and adapters (Http, Persistence). Directory collectors are not anchored, so the same
# rules apply to src/ and to the rule-test fixtures in tests/Architecture/Fixtures/src/.
deptrac:
  paths:
    - src

  layers:
    - name: TaskDomain
      collectors: [{ type: directory, value: src/Task/Domain/.* }]
    - name: TaskApplication
      collectors: [{ type: directory, value: src/Task/Application/.* }]
    - name: TaskHttp
      collectors: [{ type: directory, value: src/Task/Infrastructure/Http/.* }]
    - name: TaskPersistence
      collectors: [{ type: directory, value: src/Task/Infrastructure/Persistence/.* }]

    - name: StatusDomain
      collectors: [{ type: directory, value: src/Status/Domain/.* }]
    - name: StatusApplication
      collectors: [{ type: directory, value: src/Status/Application/.* }]
    - name: StatusHttp
      collectors: [{ type: directory, value: src/Status/Infrastructure/Http/.* }]
    - name: StatusPersistence
      collectors: [{ type: directory, value: src/Status/Infrastructure/Persistence/.* }]

    # Vendor code is outside the analysed paths, so it needs class-name collectors to be checked at all.
    # Database access: Doctrine, its Symfony bridge (e.g. #[MapEntity] loads an entity) and raw PDO.
    - name: Database
      collectors:
        - { type: classNameRegex, value: '#^Doctrine\\#' }
        - { type: classNameRegex, value: '#^Symfony\\Bridge\\Doctrine\\#' }
        - { type: classNameRegex, value: '#^PDO$#' }
    - name: Vendor
      collectors:
        - type: bool
          must:
            - { type: classNameRegex, value: '#^(?!App\\)#' }
          must_not:
            - { type: classNameRegex, value: '#^Doctrine\\#' }
            - { type: classNameRegex, value: '#^Symfony\\Bridge\\Doctrine\\#' }
            - { type: php_internal, value: '.*' }

    # Code outside the modules (e.g. Symfony's default src/Controller/) may depend on nothing: it belongs in a
    # module. Kernel.php is the framework's entry point and stays outside the rules.
    - name: Unassigned
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/.* }
          must_not:
            - { type: directory, value: src/(Task|Status)/.* }
            - { type: directory, value: src/Kernel\.php }

  ruleset:
    TaskDomain: [StatusDomain]
    TaskApplication: [TaskDomain, StatusDomain]
    TaskHttp: [TaskApplication, TaskDomain, Vendor]
    TaskPersistence: [TaskDomain, StatusDomain, Database, Vendor]

    StatusDomain: ~
    StatusApplication: [StatusDomain]
    StatusHttp: [StatusApplication, StatusDomain, Vendor]
    StatusPersistence: [StatusDomain, Database, Vendor]

    Unassigned: ~
